- key: "saml.allowNoRecipient"
  value: "false"
  version: "9.0.6"
  tags:
  - "saml"
- key: "saml.allowSpecificInvalidArtifactMessages"
  value: "false"
  version: "9.0.6"
  tags:
  - "saml"
- key: "saml.assertion.includeNSPrefixList.DS"
  value: "false"
  version: "9.0.6"
  tags:
  - "saml"
# - key: "saml20.idp.acsurlpattern"
#   # This custom property allows regular expression matching for the AssertionConsumerService URL and the protocol endpoint.
#   value: ""
#   tags:
#   - "saml"
- key: "saml.use.legacy.clockskew.default"
  value: "false"
  version: "9.0.6"
  tags:
  - "saml"
- key: "sts.requestTypeMapper.lru.size"
  value: "100"
  version: "9.0.6"
  tags:
  - "sts"
- key: "authsvc.stateMgmt.lifetime"
  value: "3600"
  version: "10.0.2"
  tags:
  - "authsvc"
- key: "authsvc.stateMgmt.memory.cleanupThread.batchSize"
  value: "1000" # Default: 0
  version: "10.0.2"
  tags:
  - "authsvc"
  - "hvdb_cleanup"
- key: "authsvc.stateMgmt.memory.cleanupWait"
  value: "120" # Default
  version: "10.0.2"
  tags:
  - "authsvc"
  - "hvdb_cleanup"
- key: "authsvc.stateMgmt.memory.maxSessions"
  value: "{{ rtss_authsvc_stateMgmt_HVDB_maxSessions }}" # Default
  version: "10.0.2"
  tags:
  - "authsvc"
- key: "distributedMap.redisServerConnectionName"
  value: "" # Required if distributed.store is Redis
  version: "10.0.2"
  tags:
  - "distributedMap"
- key: "distributedMap.store"
  value: "HVDB" # Default
  version: "10.0.2"
  tags:
  - "distributedMap"
- key: "jwks.encryption.enabled"
  value: "true"
  version: "10.0.2"
  tags:
  - "jwks"
# - key: "kessjksservice.exclude.inclusive.namespace.prefixes"
#   # Specifies a comma-separated list of prefix names. When this is set, the prefixes in the list are not added to the InclusiveNamespaces list that is in the Signature Element.
#   value: ""
#   tags:
#   - "kessjksservice"
- key: "poc.websealSignout.terminate"
  value: "true" # Default
  version: "10.0.2"
  tags:
  - "poc"
- key: "saml20.authn.request.provider.name.enabled"
  # Set to true to add ProviderName value to SAML2.0 AuthnRequests.
  value: "false"
  version: "10.0.2"
  tags:
  - "saml20"
- key: "saml20.sessionStore"
  # Specifies the SAML 2.0 session footprint store. Valid values ["DSC", "DMap"]
  value: "DMap"
  version: "10.0.2"
  tags:
  - "saml20"
- key: "saml20.signatureValidation.policy"
  # If STRICT is specified, the signature must be included in the received request and it will be validated. Allowed Values: LENIENT/STRICT
  value: "STRICT"
  version: "10.0.2"
  tags:
  - "saml20"
- key: "sts.wstrust.error.shortexception"
  # Set this parameter to True to provide a short exception in the 'wst:Reason' for STS exceptions. When this parameter is set to False, the entire exception stack is provided in 'wst:Reason'.
  value: "false"
  version: "10.0.2"
  tags:
  - "sts"
