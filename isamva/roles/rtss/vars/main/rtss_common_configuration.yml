rtss_common_configuration:
- key: "basicLdapUser.ldap.maxBinds"
  value: "5"
  tags:
  - "basicLdapUser"
- key: "basicLdapUser.ldap.minBinds"
  value: "1"
  tags:
  - "basicLdapUser"
- key: "consentDeviceRegistration.authLevelHeaderEnabled"
  value: "false"
  tags:
  - "consentDeviceRegistration"
- key: "consentDeviceRegistration.authLevelHeaderValue"
  value: "2"
  tags:
  - "consentDeviceRegistration"
- key: "deviceRegistration.allowIncompleteFingerprints"
  value: "{{ rtss_deviceRegistration_allowIncompleteFingerprints }}"
  tags:
  - "deviceRegistration"
- key: "deviceRegistration.checkForExpiredDevices"
  value: "false"
  tags:
  - "deviceRegistration"
- key: "deviceRegistration.deviceMatchThreshold"
  value: "20"
  tags:
  - "deviceRegistration"
- key: "deviceRegistration.inactiveExpirationTime"
  value: "90"
  tags:
  - "deviceRegistration"
- key: "deviceRegistration.maxRegisteredDevices"
  value: "{{ rtss_deviceRegistration_maxRegisteredDevices }}"
  tags:
  - "deviceRegistration"
- key: "deviceRegistration.maxUsageDataPerUser"
  value: "200"
  tags:
  - "deviceRegistration"
- key: "deviceRegistration.permitOnIncompleteFingerprint"
  value: "{{ rtss_deviceRegistration_permitOnIncompleteFingerprint }}"
  tags:
  - "deviceRegistration"
- key: "distributedMap.defaultTTL"
  value: "3600"
  tags:
