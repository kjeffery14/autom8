  value: "60"
  tags:
  - "sts"
- key: "userBehavior.ipAddressRequestAttribute"
  value: "urn:ibm:security:environment:http:true-client-ip"
  tags:
  - "userBehavior"
- key: "userBehavior.minimumUsageHistoryRequired"
  value: "8"
  tags:
  - "userBehavior"
- key: "wsfed.idp.rstr.excluded.elements"
  value: "default=Forwardable,Delegatable,Status,Renewing"
  tags:
  - "wsfed"
- key: "authsvc.stateMgmt.cookieless"
  # set to true to enable cookieless operation
  value: "{{ rtss_authsvc_stateMgmt_cookieless }}"
  version: "9.0.6"
  tags:
  - "authsvc"
- key: "authsvc.stateMgmt.store"
  # Valid options: DMap, DSC, Memory except if CONFIG database has not been upgrade then options are HVDB, Session, Memory
  value: "{{ rtss_authsvc_stateMgmt_store }}" 
  version: "9.0.6"
  tags:
  - "authsvc"
- key: "authsvc.stateMgmt.HVDB.lifetime"
  value: "3600"
  version: "9.0.6"
  deprecated: "10.0.2.0"
  tags:
  - "authsvc"
- key: "authsvc.stateMgmt.HVDB.maxSessions"
  # size of session cache, 4096 is suggested in a large environment.
  value: "{{ rtss_authsvc_stateMgmt_HVDB_maxSessions }}"
  version: "9.0.6"
  deprecated: "10.0.2.0"
  tags:
  - "authsvc"
- key: "js.optimizationLevel"
  value: "0"
  version: "9.0.6"
  tags:
  - "js"
- key: "js.version"
  value: "ES6"
  version: "9.0.6"
  tags:
  - "js"
