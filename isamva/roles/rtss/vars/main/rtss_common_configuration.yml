- key: "distributedMap.getRetryLimit"
  value: "0"
  tags:
  - "distributedMap"
- key: "ipReputation.dbConnectionTimeout"
  value: "120" # Default
  tags:
  - "ipReputation"
- key: "ipReputation.ipAddressAdverseReputationThreshold"
  value: "50"
  tags:
  - "ipReputation"
- key: "jwks.encryption.keystore"
  value: "{{ rtss_jwks_encryption_keystore }}"
  tags:
  - "jwks"
- key: "jwks.signing.keystore"
  value: "{{ rtss_jwks_signing_keystore }}"
  tags:
  - "jwks"
- key: "kess.crlEnabled"
  value: "{{ rtss_kess_crlEnabled }}"
  tags:
  - "kess"
- key: "kess.crlInterval"
  value: "0"
  tags:
  - "kess"
# - key: "kess.excludeInclusiveNamespacePrefixes"
#   value: ""
#   version: "9.0.6"
#   tags:
#   - "kess"
- key: "kess.hostnameValidationDisabled"
  value: "false"
  tags:
  - "kess"
- key: "kess.keySelectionCriteria"
  value: "only.alias"
  tags:
  - "kess"
- key: "kess.validateCertPath"
  value: "{{ rtss_kess_validateCertPath }}" # Default: true
  version: "10.0.3.1"
  tags:
  - "kess"
  - "kess.validateCertPath"
- key: "knowledge.questions.AnswerValidationRegEx"
  value: "[\\[()<>,;:\\\\/\\\"\\]=]" # [\[()<>,;:\\/\\"\]=]
  tags:
  - "knowledge.questions"
- key: "knowledge.questions.QuestionValidationRegEx"
  value: "[\\[()<>,;:\\\\/\\\"\\]=]"
  tags:
  - "knowledge.questions"
- key: "live.demos.enabled"
  value: "{{ rtss_live_demos_enabled }}"
  tags:
  - "live.demos"
- key: "live.demos.settings"
  value: "{{ rtss_live_demos_settings }}"
  version: "9.0.6"
  tags:
  - live.demos
  - live.demos.settings
- key: "otp.email.smtpTlsProtocol"
  value: "{{ rtss_opt_email_smtpTlsProtocol }}"
  tags:
  - "otp"
  - "otp.email"
- key: "otp.retry.enabled"
  value: "{{ rtss_otp_retry_enabled }}"
  tags:
  - "otp"
- key: "otp.retry.maxNumberOfAttempts"
  value: "6"
  tags:
  - "otp"
- key: "otp.retry.otpRetryTimeout"
  value: "300"
  tags:
  - "otp"
- key: "otp.usc.legacyBehavior"
  value: "false"
  version: "10.0.7" #??
  tags:
  - "otp"
- key: "pip.uncachedAttributes"
  value: "{{ rtss_pip_uncachedAttributes }}"
  tags:
  - "pip"
- key: "poc.authPolicy.allowRequestOverride"
  value: "true"
  tags:
  - "poc"
- key: "poc.authPolicy.authLevel"
  value: "1"
  tags:
  - "poc"
- key: "poc.authPolicy.authType"
  value: "COMPLEMENTARY"
  tags:
  - "poc"
- key: "poc.otp.authLevel"
  value: "{{ rtss_poc_otp_authLevel }}"
  tags:
  - poc
  - poc.otp
- key: "poc.otp.backwardCompatibilityEnabled"
  value: "false"
  tags:
  - poc
  - poc.otp
- key: "poc.websealAuth.authLevel"
  value: "1"
  tags:
  - "poc"
- key: "riskEngine.reportsEnabled"
  value: "{{ rtss_riskEngine_reportsEnabled }}"
  tags:
  - "riskEngine"
- key: "riskEngine.reportsMaxStored"
  value: "5"
  tags:
  - "riskEngine"
- key: "riskEngine.useRoundingMethod"
  value: "false"
  tags:
  - "riskEngine"
- key: "runtime.dbLoggingEnabled"
  value: "false"
  tags:
  - "runtime"
- key: "runtime.hashAlgorithm"
  value: "SHA-256"
  tags:
  - "runtime"
- key: "runtime.verificationHashAlgorithms"
  value: "{{ rtss_runtime_verificationHashAlgorithms }}"
  tags:
  - "runtime"
- key: "saml20.enableSubjectInAuthnRequest"
  value: "false"
  tags:
  - "saml20"
- key: "sts.ivcred.unauthenticated.user.name"
  value: ""
