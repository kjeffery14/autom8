- name: Advanced Configuration
  ansible.builtin.include_tasks: "{{ 'advanced_configuration_tags.yml' if 'advanced_configuration_tags' in ansible_run_tags else 'advanced_configuration.yml' }}"
  when:
    - ret_master.data.is_master | bool
  tags:
  - rtss
  - advanced_configuration
  - advanced_configuration_tags

- name: Runtime Parameters
  ansible.builtin.include_tasks: runtime_parameters.yml
  tags:
  - rtss
  - runtime_parameters

